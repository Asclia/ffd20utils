# Builds the desktop app (Windows .exe and Linux AppImage/.deb) and attaches the files
# to a GitHub Release. Runs when a version tag (v1.0.0, v1.1.0…) is pushed, or manually.
name: Build desktop app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ffd20-utils-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body: |
            **Windows:** baixe `FFd20-Utils-…-instalador.exe` (instala e cria atalho) ou `FFd20-Utils-…-portable.exe` (abre direto, sem instalar).
            **Linux:** baixe o `.AppImage` (dê permissão de execução e clique duas vezes) ou o `.deb` (Ubuntu/Debian).
